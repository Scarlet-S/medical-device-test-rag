name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and offline evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate repository JSON files
        run: python scripts/validate_repository_configs.py

      - name: Compile Python modules
        run: python -m compileall -q app scripts tests

      - name: Run unit tests
        run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest_tmp_ci

      - name: Run deterministic GraphRAG comparison
        run: |
          python scripts/run_graphrag_comparison.py \
            --output-json evaluation/results/graphrag_ci.json \
            --output-csv evaluation/results/graphrag_ci.csv \
            --fail-on-no-multihop-improvement

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: medical-device-test-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
